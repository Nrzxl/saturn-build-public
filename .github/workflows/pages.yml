name: SATURN Web · iPhone PWA
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'test/**'
      - 'scripts/create_pwa_icons.py'
      - 'scripts/test_*.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saturn-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Compilar e publicar SATURN Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Código público auditado
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Flutter Web
        run: flutter create --platforms=web --org com.nrzxl --project-name saturn_app .

      - name: Criar ícones SATURN para iPhone
        run: python3 scripts/create_pwa_icons.py

      - name: Validar dependências e testes
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter pub get
          flutter analyze lib
          flutter test --reporter expanded

      - name: Identificar a mesma versão no navegador e na PWA
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          sha = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}', sha):
              raise SystemExit('SHA do deploy inválido')
          html = Path('web/index.html')
          content = html.read_text(encoding='utf-8')
          marker = 'SATURN_WEB_BUILD_SHA_PLACEHOLDER'
          if content.count(marker) != 1:
              raise SystemExit('Marcador de versão HTML ausente ou duplicado')
          html.write_text(content.replace(marker, sha), encoding='utf-8')
          PY

      - name: Compilar SATURN Web / PWA
        env:
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          SATURN_SUPABASE_URL: ${{ vars.SATURN_SUPABASE_URL }}
          SATURN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SATURN_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Both variables are public client configuration, never service_role.
          # An empty pair leaves SATURN Cloud safely disabled.
          if [[ -n "$SATURN_SUPABASE_URL" && -n "$SATURN_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "SATURN Cloud: configuração pública informada"
          else
            echo "SATURN Cloud: aguardando URL e publishable key do projeto pessoal"
          fi
          flutter build web --release \
            --base-href /saturn-build-public/ \
            --dart-define="SATURN_WEB_BUILD_SHA=$PUBLIC_BUILD_SHA" \
            --dart-define="SATURN_SUPABASE_URL=$SATURN_SUPABASE_URL" \
            --dart-define="SATURN_SUPABASE_PUBLISHABLE_KEY=$SATURN_SUPABASE_PUBLISHABLE_KEY"
          echo "$PUBLIC_BUILD_SHA" > build/web/saturn-build.txt
          touch build/web/.nojekyll
          test -f build/web/manifest.json
          test -f build/web/apple-touch-icon.png
          test -f build/web/main.dart.js
          test -f build/web/flutter_bootstrap.js
          test -f build/web/saturn-build.txt
          test "$(cat build/web/saturn-build.txt)" = "$PUBLIC_BUILD_SHA"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

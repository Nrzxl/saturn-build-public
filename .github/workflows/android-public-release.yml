name: SATURN · APK público assinado

# Publicação explícita, nunca automática. Usa a mesma chave do SATURN 0.6.0.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saturn-signed-android-publication
  cancel-in-progress: false

jobs:
  signed-android:
    name: Testar, assinar e publicar SATURN.apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar código SATURN homologado
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validar credenciais sem revelar valores
        env:
          SATURN_KEYSTORE_BASE64: ${{ secrets.SATURN_KEYSTORE_BASE64 }}
          SATURN_KEYSTORE_PASSWORD: ${{ secrets.SATURN_KEYSTORE_PASSWORD }}
          SATURN_KEY_ALIAS: ${{ secrets.SATURN_KEY_ALIAS }}
          SATURN_KEY_PASSWORD: ${{ secrets.SATURN_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.SATURN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          for variable in SATURN_KEYSTORE_BASE64 SATURN_KEYSTORE_PASSWORD SATURN_KEY_ALIAS SATURN_KEY_PASSWORD GH_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Credencial ausente: $variable. Rode scripts/configurar_assinatura_publica.ps1 no seu computador."
              exit 1
            fi
          done
          if [[ "$(gh repo view Nrzxl/saturn-downloads --json visibility --jq .visibility)" != "PUBLIC" ]]; then
            echo "::error::O repositório Nrzxl/saturn-downloads precisa ser público."
            exit 1
          fi

      - name: Analisar e testar antes de gerar a versão oficial
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name saturn_app .
          python3 scripts/prepare_android_brand.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter pub get
          flutter analyze lib
          flutter test --reporter expanded

      - name: Restaurar assinatura anterior sem expor o keystore
        env:
          SATURN_KEYSTORE_BASE64: ${{ secrets.SATURN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SATURN_KEYSTORE_BASE64" | base64 --decode > android/app/saturn-release.keystore
          test -s android/app/saturn-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          original = gradle.read_text(encoding='utf-8')
          debug = 'signingConfig = signingConfigs.getByName("debug")'
          build_types = '    buildTypes {'
          if original.count(debug) != 1 or original.count(build_types) != 1:
              raise SystemExit('Gradle Android mudou: assinatura bloqueada por segurança.')
          config = '''    signingConfigs {
              create("saturnRelease") {
                  keyAlias = System.getenv("SATURN_KEY_ALIAS")
                  keyPassword = System.getenv("SATURN_KEY_PASSWORD")
                  storeFile = file("saturn-release.keystore")
                  storePassword = System.getenv("SATURN_KEYSTORE_PASSWORD")
              }
          }
          '''
          updated = original.replace(build_types, config + build_types, 1)
          updated = updated.replace(debug, 'signingConfig = signingConfigs.getByName("saturnRelease")', 1)
          existing = ['applicationId = "com.example.saturn_app"',
                      'applicationId = "com.nrzxl.saturn_app"']
          found = [item for item in existing if updated.count(item) == 1]
          if len(found) != 1:
              raise SystemExit('ApplicationId inesperado: não liberar versão pública.')
          updated = updated.replace(found[0], 'applicationId = "com.nrzxl.saturn"', 1)
          gradle.write_text(updated, encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          xml = xml.replace('android:label="saturn_app"', 'android:label="SATURN"')
          if 'android.permission.INTERNET' not in xml:
              xml = xml.replace('    <application',
                '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          manifest.write_text(xml, encoding='utf-8')
          PY

      - name: Construir APK de produção com versionCode progressivo
        env:
          SATURN_KEY_ALIAS: ${{ secrets.SATURN_KEY_ALIAS }}
          SATURN_KEY_PASSWORD: ${{ secrets.SATURN_KEY_PASSWORD }}
          SATURN_KEYSTORE_PASSWORD: ${{ secrets.SATURN_KEYSTORE_PASSWORD }}
          SATURN_SUPABASE_URL: ${{ vars.SATURN_SUPABASE_URL }}
          SATURN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SATURN_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: \([0-9.]*\)+[0-9]*$/\1/p' pubspec.yaml)
          test -n "$VERSION"
          BUILD_CODE=$((2000 + GITHUB_RUN_NUMBER))
          flutter build apk --release \
            --build-name "$VERSION" --build-number "$BUILD_CODE" \
            --dart-define="SATURN_SUPABASE_URL=${SATURN_SUPABASE_URL:-}" \
            --dart-define="SATURN_SUPABASE_PUBLISHABLE_KEY=${SATURN_SUPABASE_PUBLISHABLE_KEY:-}"
          test -s build/app/outputs/flutter-apk/app-release.apk
          APK_SHA=$(sha256sum build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')
          {
            echo "SATURN_VERSION=$VERSION"
            echo "SATURN_BUILD_CODE=$BUILD_CODE"
            echo "SATURN_APK_SHA=$APK_SHA"
            echo "SATURN_RELEASE_TAG=v$VERSION-b$BUILD_CODE"
          } >> "$GITHUB_ENV"

      - name: Validar pacote e comparar assinatura com SATURN 0.6.0
        run: |
          set -euo pipefail
          SDK_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          APKSIGNER=$(find "$SDK_TOOLS" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$SDK_TOOLS" -type f -name aapt | sort -V | tail -n 1)
          [[ -x "$APKSIGNER" && -x "$AAPT" ]] || { echo "::error::SDK de assinatura ausente."; exit 1; }
          CURRENT="build/app/outputs/flutter-apk/app-release.apk"
          "$APKSIGNER" verify --verbose "$CURRENT"
          PACKAGE=$("$AAPT" dump badging "$CURRENT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          [[ "$PACKAGE" == "com.nrzxl.saturn" ]] || { echo "::error::ID Android inesperado."; exit 1; }
          ORIGINAL="$RUNNER_TEMP/saturn-0.6.0-original.apk"
          curl -fL --retry 3 -sS \
            "https://github.com/Nrzxl/saturn-downloads/releases/download/v0.6.0-b1008/SATURN.apk" \
            -o "$ORIGINAL"
          echo "cb0a0763036cecb4f8c797d49649c53e908b8851c9b1ef90842d72693218619e  $ORIGINAL" | sha256sum --check --status || {
            echo "::error::APK original diferente do SHA-256 publicado."; exit 1;
          }
          "$APKSIGNER" verify --verbose "$ORIGINAL"
          ORIGINAL_CERT=$("$APKSIGNER" verify --print-certs "$ORIGINAL" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$CURRENT" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ -n "$ORIGINAL_CERT" && "$ORIGINAL_CERT" == "$NEW_CERT" ]] || {
            echo "::error::A assinatura NÃO coincide com a versão 0.6.0. Publicação bloqueada.";
            exit 1;
          }
          echo "Mesmo certificado Android do SATURN 0.6.0 confirmado."

      - name: Validar sequência do manifesto anterior
        env:
          GH_TOKEN: ${{ secrets.SATURN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/Nrzxl/saturn-downloads/contents/update.json --jq .content |
            base64 --decode > "$RUNNER_TEMP/saturn-update-before.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          current = json.loads((Path(os.environ["RUNNER_TEMP"]) / "saturn-update-before.json").read_text())
          previous = int(current.get("build", -1))
          new = int(os.environ["SATURN_BUILD_CODE"])
          if new <= previous:
              raise SystemExit("VersionCode não é progressivo: abortando publicação.")
          print("Build anterior:", previous, "novo:", new)
          PY

      - name: Publicar SATURN.apk no canal oficial
        env:
          GH_TOKEN: ${{ secrets.SATURN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/SATURN.apk"
          gh release create "$SATURN_RELEASE_TAG" "$RUNNER_TEMP/SATURN.apk" \
            -R Nrzxl/saturn-downloads \
            --title "SATURN $SATURN_VERSION (build $SATURN_BUILD_CODE)" \
            --notes "APK Android assinado com a mesma identidade do SATURN 0.6.0. Atualização confirmada pelo Android."

      - name: Conferir SHA do asset público antes de anunciar atualização
        env:
          GH_TOKEN: ${{ secrets.SATURN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            gh api "repos/Nrzxl/saturn-downloads/releases/tags/$SATURN_RELEASE_TAG" > "$RUNNER_TEMP/saturn-release.json"
            if python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "saturn-release.json").read_text())
          matches = [a for a in release.get("assets", []) if a.get("name") == "SATURN.apk" and a.get("state") == "uploaded"]
          if len(matches) != 1:
              sys.exit(1)
          a = matches[0]
          expected = "sha256:" + os.environ["SATURN_APK_SHA"]
          expected_url = ("https://github.com/Nrzxl/saturn-downloads/releases/download/" +
              os.environ["SATURN_RELEASE_TAG"] + "/SATURN.apk")
          sys.exit(0 if a.get("digest") == expected and a.get("browser_download_url") == expected_url else 1)
          PY
            then
              echo "Asset público verificado: SHA-256 e endereço oficiais."
              exit 0
            fi
            sleep 4
          done
          echo "::error::Asset ou SHA-256 inconsistente; manifesto antigo preservado."
          exit 1

      - name: Atualizar manifesto somente após publicação verificada
        env:
          GH_TOKEN: ${{ secrets.SATURN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess
          repo = "Nrzxl/saturn-downloads"
          path = "repos/" + repo + "/contents/update.json"
          current = json.loads(subprocess.check_output(["gh", "api", path], text=True))
          old = json.loads(base64.b64decode(current["content"]).decode())
          if int(os.environ["SATURN_BUILD_CODE"]) <= int(old.get("build", -1)):
              raise SystemExit("Manifesto mudou durante a publicação: abortado.")
          data = {
            "version": os.environ["SATURN_VERSION"],
            "build": int(os.environ["SATURN_BUILD_CODE"]),
            "apk_url": ("https://github.com/" + repo + "/releases/download/" +
                         os.environ["SATURN_RELEASE_TAG"] + "/SATURN.apk"),
            "sha256": os.environ["SATURN_APK_SHA"],
            "notes": "SATURN Android com navegação e coleções otimizadas.",
          }
          payload = {
            "message": "publish: SATURN signed build " + os.environ["SATURN_BUILD_CODE"],
            "sha": current["sha"],
            "content": base64.b64encode((json.dumps(data, ensure_ascii=False) + "\n").encode()).decode(),
          }
          subprocess.run(["gh", "api", "-X", "PUT", path, "--input", "-"],
                         input=json.dumps(payload), text=True, check=True)
          print("Manifesto publicado após verificação completa do APK.")
          PY

      - name: Arquivar APK assinado para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: saturn-android-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

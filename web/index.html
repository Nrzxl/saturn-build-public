<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211827">
  <meta name="saturn-build-sha" content="SATURN_WEB_BUILD_SHA_PLACEHOLDER">
  <meta name="description" content="SATURN — filmes, séries, doramas, animes, livros e a Nossa Órbita.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="SATURN">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Reserve the iPhone's status bar instead of drawing clickable Flutter
       actions beneath the notch/island in installed standalone mode. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SATURN">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="saturn-icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <!-- Resolve os servidores de capas antes da primeira grade Flutter. -->
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="preconnect" href="https://covers.openlibrary.org" crossorigin>
  <link rel="dns-prefetch" href="https://static.tvmaze.com">
  <link rel="dns-prefetch" href="https://is1-ssl.mzstatic.com">
  <link rel="dns-prefetch" href="https://s4.anilist.co">
  <link rel="manifest" href="manifest.json">
  <title>SATURN · Nosso universo</title>
  <style>
    html, body { height: 100%; min-height: 100%; margin: 0; background: #211827; }
    @supports (min-height: 100dvh) { html, body { min-height: 100dvh; } }
    body { overscroll-behavior-y: none; }
    #saturn-boot {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-sizing: border-box; padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
      color: #F2E8DF; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% 37%, #492239 0%, #211827 50%, #101018 100%);
      transition: opacity .35s ease;
    }
    #saturn-boot.ready { opacity: 0; pointer-events: none; }
    .saturn-orbit { position: relative; width: 116px; height: 116px; margin-bottom: 27px; }
    .saturn-core {
      position: absolute; width: 66px; height: 66px; top: 25px; left: 25px;
      border-radius: 50%; background: radial-gradient(circle at 30% 24%, #E5CBAC, #9B5671 58%, #3F2036 96%);
      box-shadow: 0 0 30px #C6A47724;
    }
    .saturn-ring {
      position: absolute; top: 47px; left: 1px; width: 113px; height: 26px;
      border: 6px solid #C6A477; border-left-color: #C6A47755;
      border-bottom-color: #DCC19A99; border-radius: 50%;
      transform: rotate(-25deg); box-sizing: border-box;
      animation: saturn-breathe 2.6s ease-in-out infinite;
    }
    .saturn-name { font-family: Georgia, "Times New Roman", serif; letter-spacing: .33em; font-size: 25px; padding-left: .33em; }
    .saturn-tagline { margin-top: 12px; font-size: 12px; letter-spacing: .08em; color: #DCC7D0; }
    .saturn-loading { margin-top: 34px; font-size: 12px; color: #C6A477; line-height: 1.6; }
    .saturn-loading a { color: #E5CBAC; }
    #saturn-retry {
      display: none; margin-top: 16px; border: 1px solid #C6A477;
      background: #392438; border-radius: 13px; padding: 11px 18px;
      font: inherit; color: #F2E8DF; cursor: pointer;
    }
    #saturn-retry.visible { display: inline-flex; }
    #saturn-network {
      position: fixed; z-index: 11000; left: 16px; right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: max-content; max-width: calc(100% - 32px);
      margin: 0 auto; padding: 11px 16px;
      border: 1px solid #79566B; border-radius: 15px;
      background: #231A2BEF; color: #F2E8DF;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center; box-sizing: border-box; pointer-events: none;
      opacity: 0; visibility: hidden; transition: opacity .2s ease;
    }
    #saturn-network.visible { opacity: 1; visibility: visible; }
    /* Shared update experience in the browser and installed PWA. */
    #saturn-update {
      position: fixed; z-index: 11010; left: 14px; right: 14px;
      bottom: max(88px, calc(env(safe-area-inset-bottom) + 76px));
      max-width: 490px; margin: 0 auto; padding: 15px 16px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      border: 1px solid #A88265; border-radius: 18px;
      background: #2C202DF5; color: #F2E8DF;
      box-shadow: 0 15px 38px #100D16B0;
      box-sizing: border-box;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #saturn-update[hidden] { display: none; }
    #saturn-update-text { flex: 1 1 180px; }
    #saturn-update strong { display: block; color: #E8CCAA; }
    #saturn-update-actions { display: flex; gap: 9px; }
    #saturn-update button {
      border-radius: 11px; padding: 9px 12px;
      font: inherit; cursor: pointer; border: 1px solid #C6A477;
      background: transparent; color: #E5CBAC;
    }
    #saturn-update-now { background: #C6A477 !important; color: #201820 !important; }
    @keyframes saturn-breathe { 50% { opacity: .65; transform: rotate(-25deg) scale(.96); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main id="saturn-boot" role="status" aria-live="polite">
    <div class="saturn-orbit" aria-hidden="true">
      <div class="saturn-core"></div><div class="saturn-ring"></div>
    </div>
    <div class="saturn-name">SATURN</div>
    <div class="saturn-tagline">Every story has its orbit.</div>
    <div class="saturn-loading" id="saturn-boot-message">Preparando seu universo de histórias…</div>
    <button id="saturn-retry" type="button">Tentar novamente</button>
  </main>
  <div id="saturn-network" role="status" aria-live="polite"></div>
  <aside id="saturn-update" role="status" aria-live="polite" hidden>
    <div id="saturn-update-text">
      <strong>Nova versão do SATURN disponível</strong>
      Mesma atualização para Web e PWA. Salve qualquer edição antes de atualizar.
    </div>
    <div id="saturn-update-actions">
      <button id="saturn-update-later" type="button">Depois</button>
      <button id="saturn-update-now" type="button">Atualizar</button>
    </div>
  </aside>
  <script>
    (function () {
      const splash = document.getElementById('saturn-boot');
      const retry = document.getElementById('saturn-retry');
      const network = document.getElementById('saturn-network');
      let networkHold;
      retry.addEventListener('click', function () { window.location.reload(); });

      function networkMessage(message, persistent) {
        window.clearTimeout(networkHold);
        network.textContent = message;
        network.classList.add('visible');
        if (!persistent) {
          networkHold = window.setTimeout(function () {
            network.classList.remove('visible');
          }, 4800);
        }
      }

      window.addEventListener('offline', function () {
        networkMessage('Sem conexão. As listas locais continuam disponíveis; os catálogos podem falhar.', true);
      });
      window.addEventListener('online', function () {
        networkMessage('Conexão restabelecida. Você pode atualizar o catálogo.', false);
      });
      if (!navigator.onLine) {
        networkMessage('Sem conexão. O SATURN precisa de rede para carregar o catálogo.', true);
      }

      window.addEventListener('flutter-first-frame', function () {
        splash.classList.add('ready');
        window.setTimeout(function () { splash.remove(); }, 400);
      }, { once: true });
      window.setTimeout(function () {
        if (!splash.isConnected || splash.classList.contains('ready')) return;
        const status = document.getElementById('saturn-boot-message');
        status.textContent = navigator.onLine
          ? 'O carregamento está demorando. Verifique sua conexão.'
          : 'Sem conexão. O primeiro carregamento exige acesso à rede.';
        retry.classList.add('visible');
      }, 25000);
    })();
  </script>
  <script>
    // Reuses already-viewed Open Library covers on future visits, including
    // installed iPhone/Android PWAs. It does not cache personal SATURN data.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./saturn-cover-cache-sw.js', {
          scope: './'
        }).catch(() => { /* private mode or browser restriction */ });
      }, { once: true });
    }
  </script>
  <script>
    // The browser tab and installed PWA use exactly one GitHub Pages build.
    // Read the deployed SHA without caching; never clear private user data.
    (function () {
      const localBuild = (document.querySelector('meta[name="saturn-build-sha"]')
        ?.content || '').trim();
      if (!/^[a-f0-9]{40}$/.test(localBuild)) return;
      const prompt = document.getElementById('saturn-update');
      const later = document.getElementById('saturn-update-later');
      const now = document.getElementById('saturn-update-now');
      let availableBuild = '';
      let postponedBuild = '';
      let lastCheckAt = 0;
      async function checkForUpdates() {
        const stamp = Date.now();
        if (document.hidden || !navigator.onLine || stamp - lastCheckAt < 30000) return;
        lastCheckAt = stamp;
        try {
          const url = new URL('saturn-build.txt', document.baseURI);
          url.searchParams.set('check', String(stamp));
          const response = await fetch(url.toString(), {
            cache: 'no-store',
            credentials: 'omit'
          });
          if (!response.ok) return;
          const published = (await response.text()).trim();
          if (!/^[a-f0-9]{40}$/.test(published)) return;
          if (published !== localBuild && published !== postponedBuild) {
            availableBuild = published;
            prompt.hidden = false;
          } else if (published === localBuild) {
            availableBuild = '';
            prompt.hidden = true;
          }
        } catch (_) {
          // Offline use must not be blocked by an update check.
        }
      }
      later.addEventListener('click', function () {
        postponedBuild = availableBuild;
        prompt.hidden = true;
      });
      now.addEventListener('click', function () {
        if (!/^[a-f0-9]{40}$/.test(availableBuild)) return;
        // Keeps PWA scope and user/session storage; bypasses old HTML caches.
        const next = new URL(window.location.href);
        next.searchParams.set('saturn_build', availableBuild.slice(0, 12));
        window.location.replace(next.toString());
      });
      window.addEventListener('focus', checkForUpdates);
      window.addEventListener('online', checkForUpdates);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) checkForUpdates();
      });
      window.setTimeout(checkForUpdates, 12000);
      window.setInterval(checkForUpdates, 4 * 60 * 1000);
    })();
  </script>

  <script>
    // Web Push permission is requested ONLY after the user taps "Ativar".
    // The existing SATURN worker also handles public cover caching.
    window.saturnPushSupport = function () {
      const ua = navigator.userAgent || '';
      if (!('serviceWorker' in navigator) || !('PushManager' in window) ||
          !('Notification' in window)) {
        if (/iPad|iPhone|iPod/.test(ua) &&
            !window.navigator.standalone &&
            !window.matchMedia('(display-mode: standalone)').matches) {
          return 'install';
        }
        return 'unsupported';
      }
      return Notification.permission === 'denied' ? 'denied' : 'supported';
    };
    window.saturnPushPermission = function () {
      // Call requestPermission before the first await: iOS requires
      // a directly tapped activation, never a delayed network callback.
      if (window.saturnPushSupport() !== 'supported') {
        return Promise.resolve(window.saturnPushSupport());
      }
      return Notification.requestPermission();
    };
    window.saturnPushSubscribe = async function (publicKey) {
      const raw = String(publicKey).replace(/-/g, '+').replace(/_/g, '/');
      const padded = raw.padEnd(Math.ceil(raw.length / 4) * 4, '=');
      const decoded = atob(padded);
      const bytes = new Uint8Array(decoded.length);
      for (let i = 0; i < decoded.length; i++) bytes[i] = decoded.charCodeAt(i);
      const reg = await navigator.serviceWorker.register(
        './saturn-cover-cache-sw.js', {scope: './'});
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true, applicationServerKey: bytes
      });
      return JSON.stringify(sub.toJSON());
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
